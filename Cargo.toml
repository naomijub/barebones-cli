[workspace]
members = [
    "crates/*"
]
resolver = "3"

[package]
name = "barebones"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "barebones-cli"
path = "src/bin/main.rs"

[workspace.dependencies]
cli-dev = { path = "crates/cli-dev" }

clap = { version = "4", features = ["derive"]}
comfy-table = "7"
config = { version = "0.15", features = ["toml"] }
crossbeam-channel = "0.5"
csv = "1"
ctrlc = "3"
dirs = "6"
exitcode = "1"
notify = "8"
thiserror = "2"
toml = "0.9.8"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
cli-dev.workspace = true
anyhow = "1" # Executable dependency only
clap.workspace = true
config.workspace = true
crossbeam-channel.workspace = true
ctrlc.workspace = true
dirs.workspace = true
exitcode.workspace = true
human-panic = "2" # Only executable should handle panic
notify.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true


[dev-dependencies]
assert_cmd = "2"
trycmd = "0.15"

[lints]
workspace = true

[workspace.lints.clippy]
all = "deny"
deprecated_safe = "deny"
wildcard_imports = "deny"
missing_const_for_fn = "deny"
option_if_let_else = "deny"
or_fun_call = "deny"
get_first = "deny"
redundant_clone = "deny"
manual_ok_or = "deny"
unnecessary_wraps = "deny"
needless_collect = "deny"
get_unwrap = "deny"
manual_while_let_some = "deny"
panicking_unwrap = "deny"
unnecessary_unwrap = "deny"
unnecessary_literal_unwrap = "deny"
unwrap_in_result = "deny"

[workspace.lints.rust]
nonstandard-style = "deny"
future-incompatible = "deny"
