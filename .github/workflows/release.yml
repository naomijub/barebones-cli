name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: barebones-cli
            asset_name: barebones-cli_linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: barebones-cli
            asset_name: barebones-cli_macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: barebones-cli
            asset_name: barebones-cli_macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: barebones-cli.exe
            asset_name: barebones-cli_windows-amd64.exe

    steps:
      - uses: actions/checkout@v4
      - name: Extract version from tag
        id: vtag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux: Install OpenSSL development packages
      - name: Install OpenSSL (Linux GNU)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      
      # macOS: OpenSSL is pre-installed, but might need pkg-config
      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install openssl pkgconfig
      
      # Windows: Use vcpkg for OpenSSL
      - name: Install OpenSSL (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          vcpkg integrate install
          vcpkg install openssl:x64-windows-static
        shell: pwsh
      
      # Windows: Set environment variables for OpenSSL
      - name: Set OpenSSL environment (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "OPENSSL_DIR=C:/vcpkg/installed/x64-windows-static" >> $GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $GITHUB_ENV
        shell: bash
      
      # macOS: Set OpenSSL environment variables
      - name: Set OpenSSL environment (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
      
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      
      - name: Strip binary (Linux and macOS)
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
      
      - name: Create tarball (Linux and macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.asset_name }}_${{ steps.vtag.outputs.VERSION }}.tar.gz ${{ matrix.artifact_name }}
          cd -
      
      - name: Create zip (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.asset_name }}_${{ steps.vtag.outputs.VERSION }}.zip ${{ matrix.artifact_name }}
          cd -
      
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}_${{ steps.vtag.outputs.VERSION }}.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Create Release Notes
        run: |
          echo "# Release ${{ steps.version.outputs.VERSION }}" > release_notes.md
          echo "" >> release_notes.md
          echo "## Changes" >> release_notes.md
          echo "See CHANGELOG.md for details" >> release_notes.md